server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 64k;
    # DNS embutido do Docker: resolve novamente se a API ganhar outro IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # O navegador chama a mesma origem. Não há URL de Codespace nem token no JS.
    location /api/ {
        set $api_backend api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Cookies de autenticação do túnel Codespaces não pertencem à nossa API.
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 25s;
        proxy_redirect off;
    }
    location / { try_files $uri $uri/ =404; }
}
