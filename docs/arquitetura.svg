<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-labelledby="titulo desc">
<title id="titulo">Arquitetura da Estante Acadêmica</title><desc id="desc">O navegador acessa o Nginx da interface. O Nginx encaminha chamadas REST à API FastAPI. A API persiste os cadastros no SQLite em volume Docker e consulta a Search API da Open Library por HTTPS. Há dois componentes próprios e um serviço externo.</desc>
<defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#507466"/></marker></defs>
<rect width="1240" height="600" fill="#fff"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#173d30">
<text x="42" y="52" font-size="29" font-weight="700">Estante Acadêmica</text><text x="42" y="80" fill="#63796a" font-size="15">Arquitetura · dois componentes próprios + um serviço externo · REST / JSON</text>
<rect x="263" y="115" width="650" height="425" rx="18" fill="#f3f7f2" stroke="#9eb7a3" stroke-dasharray="7 5"/><text x="287" y="145" font-size="15" font-weight="600">Docker Compose · rede interna da aplicação</text>
<rect x="40" y="210" width="165" height="128" rx="12" fill="#f6f7f5" stroke="#bacbbd"/><text x="122" y="244" text-anchor="middle" font-weight="700" font-size="19">Navegador</text><text x="122" y="274" text-anchor="middle" font-size="14">HTML + CSS + JS</text><text x="122" y="300" text-anchor="middle" font-size="13" fill="#617565">Porta 8080</text>
<rect x="306" y="200" width="222" height="147" rx="13" fill="#e4f0e7" stroke="#719b7f"/><text x="329" y="230" font-size="12" fill="#446e51">COMPONENTE PRÓPRIO 1</text><text x="329" y="261" font-size="21" font-weight="700">Interface / Nginx</text><text x="329" y="289" font-size="14">Arquivos estáticos</text><text x="329" y="312" font-size="14">Proxy reverso de /api/…</text>
<rect x="659" y="200" width="220" height="147" rx="13" fill="#e4f0e7" stroke="#719b7f"/><text x="682" y="230" font-size="12" fill="#446e51">COMPONENTE PRÓPRIO 2</text><text x="682" y="261" font-size="21" font-weight="700">API / FastAPI</text><text x="682" y="289" font-size="14">Validação e cadastro</text><text x="682" y="312" font-size="14">Consulta e trata metadados</text>
<rect x="993" y="202" width="210" height="144" rx="13" fill="#fff0d8" stroke="#c4a568"/><text x="1013" y="232" font-size="12" fill="#8a682b">SERVIÇO EXTERNO</text><text x="1013" y="262" font-size="22" font-weight="700">Open Library</text><text x="1013" y="290" font-size="14">GET /search.json</text><text x="1013" y="314" font-size="14">Metadados bibliográficos</text>
<path d="M208 272H303" fill="none" stroke="#507466" stroke-width="2" marker-start="url(#seta)" marker-end="url(#seta)"/><text x="255" y="185" text-anchor="middle" font-size="12">HTTP</text><text x="255" y="365" text-anchor="middle" font-size="11" fill="#63796a">HTTPS no túnel</text><text x="255" y="382" text-anchor="middle" font-size="11" fill="#63796a">do Codespaces</text>
<path d="M532 272H655" fill="none" stroke="#507466" stroke-width="2" marker-start="url(#seta)" marker-end="url(#seta)"/><text x="594" y="242" text-anchor="middle" font-size="13">REST / JSON</text><text x="594" y="309" text-anchor="middle" font-size="11">GET · POST</text><text x="594" y="328" text-anchor="middle" font-size="11">PUT · DELETE</text>
<path d="M883 272H989" fill="none" stroke="#507466" stroke-width="2" marker-start="url(#seta)" marker-end="url(#seta)"/><text x="939" y="244" text-anchor="middle" font-size="12">HTTPS</text><text x="939" y="309" text-anchor="middle" font-size="12">JSON</text>
<path d="M771 351V405" fill="none" stroke="#507466" stroke-width="2" marker-start="url(#seta)" marker-end="url(#seta)"/><text x="799" y="382" font-size="12">SQL</text>
<path d="M649 431C649 405 883 405 883 431V483C883 510 649 510 649 483Z" fill="#e8edf4" stroke="#9bb0c5"/><ellipse cx="766" cy="431" rx="117" ry="17" fill="#eef2f8" stroke="#9bb0c5"/><text x="766" y="467" text-anchor="middle" font-size="17" font-weight="700">SQLite · /data/estante.db</text><text x="766" y="491" text-anchor="middle" font-size="12">Volume: estante-academica-dados</text>
<text x="307" y="432" font-size="13" fill="#617565">Repositórios separados:</text><text x="307" y="457" font-size="13">estante-academica-front</text><text x="307" y="480" font-size="13">estante-academica-api</text>
<text x="42" y="577" font-size="13" fill="#63796a">A busca externa não cadastra livros automaticamente. POST salva a seleção; PUT atualiza a leitura; DELETE remove o cadastro local.</text>
</g></svg>
